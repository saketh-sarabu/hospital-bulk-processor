[project]
name = "hospital-bulk-processor"
version = "0.1.0"
description = "Bulk CSV processing service for the Hospital Directory API"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "fastapi==0.135.1",
    "uvicorn[standard]==0.42.0",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.26",
    "httpx==0.28.1",
]
[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
]


[tool.pytest.ini_options]
asyncio_mode = "strict"
pythonpath = ["."]
